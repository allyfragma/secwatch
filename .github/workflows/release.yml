name: Release
# Push a tag like v0.2.0: tests, source archive + SHA256SUMS on a GitHub release,
# multi-arch image ghcr.io/<owner>/secwatch:{0.2.0,0.2,latest}.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt && python -m pytest -q

      - name: Version in code matches the tag
        run: |
          code="v$(python -c 'import secwatch; print(secwatch.__version__)')"
          [ "$code" = "$GITHUB_REF_NAME" ] || { echo "secwatch/__init__.py says $code, tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Source archive and checksums
        run: |
          name="secwatch-$GITHUB_REF_NAME"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "$name.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "secwatch-$GITHUB_REF_NAME.tar.gz" SHA256SUMS --generate-notes --verify-tag

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/secwatch
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
